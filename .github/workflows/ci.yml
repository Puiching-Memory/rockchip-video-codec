name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-tidy cmake g++ ninja-build
      - name: Configure
        run: cmake -B .build/lint -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Run clang-tidy
        run: |
          mapfile -t SOURCES < <(find core cli codecs -name '*.cpp' -print | sort)
          clang-tidy -p .build/lint "${SOURCES[@]}" 2>&1 | tee tidy-report.txt
          ! grep "error:" tidy-report.txt

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ ninja-build
      - name: Configure and build
        run: |
          cmake -B .build/tests -G Ninja -DCMAKE_BUILD_TYPE=Debug -DRKVC_CORE_BUILD_TESTS=ON
          cmake --build .build/tests
      - name: Run C++ tests
        run: ctest --test-dir .build/tests --output-on-failure
      - name: Run Python tests
        run: python3 -m unittest discover -s tests/python -p 'test_*.py' -v
      - name: Run Bash tests
        run: |
          for test_script in tests/bash/test_*.sh; do
            bash "$test_script"
          done
