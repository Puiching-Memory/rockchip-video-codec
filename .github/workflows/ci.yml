name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Codec projects only warn-and-skip when a dependency is missing, so both
# jobs fetch what CI can provide (MPP headers, SVT-AV1 4.2.0 built from the
# pinned submodule) and then assert the expected test set, which turns silent
# skips into failures. The distro package (noble: 1.7.0) is too old for the
# av1 plugin, so SVT-AV1 is built from third_party/SVT-AV1 in both jobs.
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Fetch submodules
        run: |
          git submodule update --init --depth 1 third_party/mpp \
            third_party/SVT-AV1
      - name: Cache SVT-AV1
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build/svt-install
          # EbSvtAv1.h 带版本宏，内容变化即换 key。
          key: svt-av1-${{ runner.os }}-${{ hashFiles('third_party/SVT-AV1/Source/API/EbSvtAv1.h') }}
      - name: Build SVT-AV1
        run: |
          if [ -f .build/svt-install/lib/libSvtAv1Enc.so ]; then
            exit 0
          fi
          cmake -S third_party/SVT-AV1 -B .build/svt -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_APPS=OFF \
            -DBUILD_TESTING=OFF -DSVT_AV1_LTO=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/.build/svt-install"
          cmake --build .build/svt -j"$(nproc)"
          cmake --install .build/svt
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format-18 clang-tidy cmake g++ \
            ninja-build
      - name: Check formatting
        run: tools/check-format.sh
      - name: Configure
        run: |
          cmake -B .build/lint -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DRKVC_CORE_BUILD_TESTS=ON \
            -DSVT_AV1_INSTALL_PREFIX="$PWD/.build/svt-install"
      - name: Run clang-tidy
        run: |
          # Shipped code only: test targets expand doctest.h, which costs ~7x
          # the whole lint run and feeds clang-analyzer false positives.
          # clang-analyzer findings are fatal; the rest stay advisory and are
          # summarized, so the log stays readable.
          run-clang-tidy -p .build/lint -j "$(nproc)" -quiet \
            -warnings-as-errors 'clang-analyzer-*' '(^|/)(src|include)/' \
            > tidy-report.txt 2>&1
          sed -i 's/\x1b\[[0-9;]*m//g' tidy-report.txt
          echo "--- findings by check ---"
          grep -oE '\[[^]]+\]$' tidy-report.txt | sort | uniq -c | sort -rn || true
          if grep -qE "error:" tidy-report.txt; then
            echo "--- errors ---"
            grep -E "error:" tidy-report.txt
            exit 1
          fi

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Fetch submodules
        run: |
          git submodule update --init --depth 1 third_party/mpp \
            third_party/SVT-AV1
      - name: Cache SVT-AV1
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build/svt-install
          key: svt-av1-${{ runner.os }}-${{ hashFiles('third_party/SVT-AV1/Source/API/EbSvtAv1.h') }}
      - name: Build SVT-AV1
        run: |
          if [ -f .build/svt-install/lib/libSvtAv1Enc.so ]; then
            exit 0
          fi
          cmake -S third_party/SVT-AV1 -B .build/svt -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_APPS=OFF \
            -DBUILD_TESTING=OFF -DSVT_AV1_LTO=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/.build/svt-install"
          cmake --build .build/svt -j"$(nproc)"
          cmake --install .build/svt
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ ninja-build
      - name: Configure and build
        run: |
          cmake -B .build/tests -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DRKVC_CORE_BUILD_TESTS=ON \
            -DSVT_AV1_INSTALL_PREFIX="$PWD/.build/svt-install"
          cmake --build .build/tests
      - name: Assert the expected test set is registered
        run: |
          ctest --test-dir .build/tests -N > tests.txt
          missing=0
          for t in test_status_result test_spec_frame test_rkmodel test_queue \
                   test_pipeline test_c_abi test_download test_plugin test_cli \
                   test_ps test_rans test_pixel test_ratectl test_mlvc_tables \
                   test_mlvc_codec test_sr_post test_mpp_logic test_mpp_plugin \
                   test_av1; do
            grep -qE "Test +#[0-9]+: ${t}$" tests.txt || {
              echo "缺少测试: $t" >&2
              missing=1
            }
          done
          exit "$missing"
      - name: Run C++ tests
        run: ctest --test-dir .build/tests --output-on-failure
      - name: Run Python tests
        run: python3 -m unittest discover -s tests/python -p 'test_*.py' -v
      - name: Run Bash tests
        run: |
          for test_script in tests/bash/test_*.sh; do
            bash "$test_script"
          done

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Fetch cross-build submodules
        run: |
          git submodule update --init --depth 1 third_party/mpp \
            third_party/SVT-AV1
      - name: Build aarch64 portable package
        # 脚本自带 docker 重入：构建 jammy 交叉镜像 → 交叉编译（rknnrt 按
        # SHA-256 固定下载）→ 组装 → RUNPATH/依赖闭包/符号审计 → qemu
        # 包内自测；tarball 落在 .build/dist/。
        # 镜像内默认用 chsrc 换到国内镜像站；GitHub  runner 在境外，官方源
        # 本就快，这里保持官方源。
        env:
          RKVC_CHSRC_MIRROR: default
        run: tools/portable/build.sh
      - name: Show package
        run: |
          ls -l .build/dist/
          cat .build/dist/*.sha256
