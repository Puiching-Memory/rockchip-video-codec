name: CI

on:
  push:
  pull_request:
  release:
    types: [published]

concurrency:
  # 事件名入组：push tag 与随后的 release 触发不会互相取消
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: clang-tidy
    # release 事件仅用于挂载产物，无需重复跑 lint/test
    if: github.event_name != 'release'
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Init submodules (shallow)
        run: git submodule update --init --depth 1 --recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-tidy cmake ninja-build

      - name: Install librga (from submodule)
        run: ./scripts/install-librga.sh

      - name: Generate ffmpeg config headers
        run: |
          cd third_party/ffmpeg-rockchip
          ./configure --disable-everything --disable-doc --disable-programs

      - name: Build SVT-AV1 submodule
        run: |
          chmod +x scripts/build-svt.sh
          ./scripts/build-svt.sh

      - name: Create compile_commands.json
        run: |
          # CI 不启用授权模块（与打包一致，无需 libsodium）
          # x86 runner 无官方 x86_64 librknnrt（仅 aarch64/armhf），NPU/MLVC 保持关闭；
          # MLVC 代码路径由 arm64 test job 按需启用并覆盖。
          cmake -B .build/release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DRKVC_ENABLE_LICENSE=OFF \
            -DRKVC_ENABLE_RKNN=OFF \
            -DRKVC_ENABLE_MLVC=OFF

      - name: Run clang-tidy
        run: |
          # license*.c 仅在 RKVC_ENABLE_LICENSE=ON 时参与构建，CI 默认关闭故跳过
          mapfile -t TIDY_SRCS < <(find lib -maxdepth 1 -name '*.c' ! -name 'license*.c' | sort)
          clang-tidy -p .build/release \
            --header-filter=include/.* \
            "${TIDY_SRCS[@]}" 2>&1 | tee tidy-report.txt
          # 允许警告但不允许错误
          ! grep "error:" tidy-report.txt

  test:
    name: Unit Tests
    if: github.event_name != 'release'
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Init submodules (shallow)
        run: git submodule update --init --depth 1 --recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build libcmocka-dev libdrm-dev autoconf automake libtool python3-venv ripgrep binutils

      - name: Install ONNX test dependency
        run: |
          python3 -m venv .venv
          .venv/bin/pip install onnx==1.16.1

      - name: Build libsodium
        run: ./scripts/install-libsodium.sh

      - name: Install librga (from submodule)
        run: ./scripts/install-librga.sh

      - name: Build MPP
        run: |
          cmake -B /tmp/mpp-build -S third_party/mpp \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/mpp-install
          source scripts/build-common.sh
          rkvc_limit_build_jobs
          cmake --build /tmp/mpp-build -j"$BUILD_JOBS"
          cmake --install /tmp/mpp-build

      - name: Build SVT-AV1 submodule
        run: |
          chmod +x scripts/build-svt.sh
          ./scripts/build-svt.sh

      - name: Build ffmpeg-rockchip (av1 decode)
        run: |
          chmod +x scripts/rebuild-ffmpeg-av1.sh
          MPP_PREFIX=/tmp/mpp-install scripts/rebuild-ffmpeg-av1.sh

      - name: Install librknnrt (optional, enables MLVC unit tests)
        run: |
          # arm64 runner 可下载官方 aarch64 librknnrt；失败不阻断——
          # CMake 检测不到时自动降级，MLVC 单测（test_rans/test_mlvc_pixel）跳过。
          if ! ./scripts/install-rknnrt.sh; then
            echo "::warning::librknnrt 下载失败，MLVC 单测将跳过"
          fi

      - name: Configure
        run: |
          # RKNN/MLVC 自适应：install-rknnrt.sh 成功则启用并跑 MLVC 单测；
          # 无 librknnrt 时 CMake 自动降级（WARNING），构建不失败。
          cmake -B .build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DRKVC_BUILD_TESTS=ON \
            -DMPP_BUILD_DIR=/tmp/mpp-build \
            -DRKVC_ENABLE_RKNN=ON \
            -DRKVC_ENABLE_MLVC=ON \
            -DRKVC_ENABLE_MODEL_CRYPT=ON

      - name: Build
        run: |
          source scripts/build-common.sh
          rkvc_limit_build_jobs
          ninja -C .build/release -j"$BUILD_JOBS"

      - name: Test
        env:
          RKVC_VALGRIND_HARDWARE: "0"
        run: cd .build/release && ctest --output-on-failure --output-junit results.xml

      - name: Check exported symbols
        run: ./scripts/check-exported-symbols.sh .build/release/librkvc.so

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: .build/release/results.xml

  package:
    name: Package
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Init submodules (shallow)
        run: git submodule update --init --depth 1 --recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake ninja-build patchelf libdrm-dev gcc pkg-config

      - name: Install librga (from submodule)
        run: ./scripts/install-librga.sh

      - name: Build MPP
        run: |
          cmake -B /tmp/mpp-build -S third_party/mpp \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/mpp-install
          source scripts/build-common.sh
          rkvc_limit_build_jobs
          cmake --build /tmp/mpp-build -j"$BUILD_JOBS"
          cmake --install /tmp/mpp-build

      - name: Build SVT-AV1 submodule
        run: |
          chmod +x scripts/build-svt.sh
          ./scripts/build-svt.sh

      - name: Build ffmpeg-rockchip (av1 decode)
        run: |
          chmod +x scripts/rebuild-ffmpeg-av1.sh
          MPP_PREFIX=/tmp/mpp-install scripts/rebuild-ffmpeg-av1.sh

      - name: Build
        run: |
          # runner 无 librknnrt，关闭 NPU 模块避免 CMake 配置失败
          source scripts/build-common.sh
          rkvc_limit_build_jobs
          cmake -B .build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMPP_BUILD_DIR=/tmp/mpp-build \
            -DRKVC_ENABLE_LICENSE=OFF \
            -DRKVC_ENABLE_RKNN=OFF \
            -DRKVC_ENABLE_MLVC=OFF
          ninja -C .build/release -j"$BUILD_JOBS"

      - name: Build portable package
        # 标准版（不加 --license）；授权版仅本地/发码流程使用。
        # runner 无模型生产环境（.venv/rknn-toolkit2），用 --no-rknn 产不含 NPU 的通用包；
        # 带模型的分发包在板端跑 ./scripts/package-portable.sh --platforms ...（模型自动生产）。
        # --no-test: 打包后自动自测由下方独立 Test 步骤承担（且 runner 非 rk 板，自动自测本会跳过）。
        run: ./scripts/package-portable.sh --no-rknn --no-test --platforms rk3588

      - name: Check version literals
        run: ./scripts/check-version-literals.sh

      - name: Test portable package
        run: |
          # shellcheck source=scripts/build-common.sh
          source scripts/build-common.sh
          ./scripts/test-portable.sh ".build/dist/$(rkvc_portable_pkg_dir rk3588)-no-npu"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            .build/dist/*.tar.gz

  cross-package:
    # 每个平台独立 job 并行构建/打包；fail-fast=false 保证单平台失败不拖垮其余平台
    name: Cross package (${{ matrix.platform }})
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [rk3588, rk3576, rv1126b]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Init submodules (shallow)
        run: git submodule update --init --depth 1 --recursive

      - name: Enable Ubuntu arm64 multiarch packages
        run: |
          sudo dpkg --add-architecture arm64
          if [[ -f /etc/apt/sources.list.d/ubuntu.sources ]]; then
            # 24.04+：deb822 格式，限制 amd64 架构
            if ! grep -q '^Architectures:' /etc/apt/sources.list.d/ubuntu.sources; then
              sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
            fi
          else
            # 22.04-：行式 sources.list。云端镜像常见 mirror+file: 协议（展开后无
            # 架构限制，apt 会误拉 arm64 导致 404），直接重写为官方行式源并限 amd64。
            . /etc/os-release
            sudo tee /etc/apt/sources.list >/dev/null <<EOF
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu $VERSION_CODENAME main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu $VERSION_CODENAME-updates main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu $VERSION_CODENAME-backports main restricted universe multiverse
          deb [arch=amd64] http://security.ubuntu.com/ubuntu $VERSION_CODENAME-security main restricted universe multiverse
          EOF
          fi
          . /etc/os-release
          printf '%s\n' \
            'Types: deb' \
            'URIs: http://ports.ubuntu.com/ubuntu-ports/' \
            "Suites: $VERSION_CODENAME $VERSION_CODENAME-updates $VERSION_CODENAME-backports $VERSION_CODENAME-security" \
            'Components: main universe restricted multiverse' \
            'Architectures: arm64' \
            'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' | \
            sudo tee /etc/apt/sources.list.d/ubuntu-ports-arm64.sources >/dev/null

      - name: Install host, cross and QEMU dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            autoconf automake binutils cmake curl gcc g++ git libtool make ninja-build \
            patchelf pkg-config python3 python3-venv qemu-user \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross \
            libdrm-dev:arm64 zlib1g-dev:arm64

      - name: Cross-build, package and run QEMU smoke tests
        run: |
          # CI 不持久化生产密钥，故产出未加密模型的测试包；生产打包默认加密。
          # 每个 matrix job 只打自己的平台（SR 模型支持 rk3588/rk3576/rv1126b）。
          BUILD_JOBS=6 ./scripts/package-portable.sh \
            --target-arch aarch64 \
            --platforms ${{ matrix.platform }} \
            --no-encrypt-models \
            --qemu-test

      - name: Upload AArch64 portable package
        uses: actions/upload-artifact@v7
        with:
          name: aarch64-portable-${{ matrix.platform }}
          path: .build/cross/aarch64/dist/*.tar.gz

  # Release 发布后：把本次 run 的 CI 产物（x86 通用包 + 三平台 AArch64 包）挂载到 release。
  # release 事件触发时 package/cross-package job 会重新并行构建，保证产物对应 tag 源码。
  attach-release:
    name: Attach CI artifacts to release
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [package, cross-package]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download run artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Upload packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find dist -type f -name '*.tar.gz' | sort)
          [[ ${#FILES[@]} -gt 0 ]] || { echo "没有可上传的 tar.gz 产物"; exit 1; }
          gh release upload "${{ github.event.release.tag_name }}" "${FILES[@]}" --clobber
          echo "已上传 ${#FILES[@]} 个产物到 release ${{ github.event.release.tag_name }}"
