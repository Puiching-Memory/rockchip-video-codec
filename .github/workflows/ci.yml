name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: clang-tidy
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Init submodules (shallow)
        run: git submodule update --init --depth 1 --recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-tidy cmake ninja-build

      - name: Install librga (from submodule)
        run: ./scripts/install-librga.sh

      - name: Generate ffmpeg config headers
        run: |
          cd third_party/ffmpeg-rockchip
          ./configure --disable-everything --disable-doc --disable-programs

      - name: Build SVT-AV1 submodule
        run: |
          chmod +x scripts/build-svt.sh
          ./scripts/build-svt.sh

      - name: Create compile_commands.json
        run: |
          cmake -B .build/release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: |
          clang-tidy -p .build/release \
            --header-filter=include/.* \
            lib/*.c 2>&1 | tee tidy-report.txt
          # 允许警告但不允许错误
          ! grep "error:" tidy-report.txt

  test:
    name: Unit Tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Init submodules (shallow)
        run: git submodule update --init --depth 1 --recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build libcmocka-dev libdrm-dev

      - name: Install librga (from submodule)
        run: ./scripts/install-librga.sh

      - name: Build MPP
        run: |
          cmake -B /tmp/mpp-build -S third_party/mpp \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/mpp-install
          cmake --build /tmp/mpp-build -j$(nproc)
          cmake --install /tmp/mpp-build

      - name: Build SVT-AV1 submodule
        run: |
          chmod +x scripts/build-svt.sh
          ./scripts/build-svt.sh

      - name: Build ffmpeg-rockchip (av1 decode)
        run: |
          chmod +x scripts/rebuild-ffmpeg-av1.sh
          MPP_PREFIX=/tmp/mpp-install scripts/rebuild-ffmpeg-av1.sh

      - name: Configure
        run: |
          cmake -B .build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DRKVC_BUILD_TESTS=ON \
            -DMPP_BUILD_DIR=/tmp/mpp-build

      - name: Build
        run: ninja -C .build/release

      - name: Test
        env:
          RKVC_VALGRIND_HARDWARE: "0"
        run: cd .build/release && ctest --output-on-failure --output-junit results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: .build/release/results.xml

  package:
    name: Package
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Init submodules (shallow)
        run: git submodule update --init --depth 1 --recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake ninja-build patchelf libdrm-dev gcc pkg-config

      - name: Install librga (from submodule)
        run: ./scripts/install-librga.sh

      - name: Build MPP
        run: |
          cmake -B /tmp/mpp-build -S third_party/mpp \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/mpp-install
          cmake --build /tmp/mpp-build -j$(nproc)
          cmake --install /tmp/mpp-build

      - name: Build SVT-AV1 submodule
        run: |
          chmod +x scripts/build-svt.sh
          ./scripts/build-svt.sh

      - name: Build ffmpeg-rockchip (av1 decode)
        run: |
          chmod +x scripts/rebuild-ffmpeg-av1.sh
          MPP_PREFIX=/tmp/mpp-install scripts/rebuild-ffmpeg-av1.sh

      - name: Build and package
        run: |
          cmake -B .build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DMPP_BUILD_DIR=/tmp/mpp-build
          ninja -C .build/release package

      - name: Build portable package
        run: ./scripts/package-portable.sh

      - name: Check version literals
        run: ./scripts/check-version-literals.sh

      - name: Test portable package
        run: |
          # shellcheck source=scripts/build-common.sh
          source scripts/build-common.sh
          ./scripts/test-portable.sh ".build/dist/$(rkvc_portable_pkg_dir)"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            .build/release/packages/*.tar.gz
            .build/dist/*.tar.gz
