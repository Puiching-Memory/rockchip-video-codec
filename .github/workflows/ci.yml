name: CI

on:
  push:
  pull_request:
  release:
    types: [published]

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Initialize libsodium
        run: git submodule update --init --depth 1 third_party/libsodium
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake clang-tidy cmake libtool ninja-build
      - name: Build libsodium
        run: bash tools/install-libsodium.sh
      - name: Configure
        run: cmake -B .build/lint -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Run clang-tidy
        run: |
          mapfile -t SOURCES < <(find lib cli -name '*.c' -print | sort)
          clang-tidy -p .build/lint --header-filter=include/.* "${SOURCES[@]}" 2>&1 | tee tidy-report.txt
          ! grep "error:" tidy-report.txt

  test:
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Initialize libsodium
        run: git submodule update --init --depth 1 third_party/libsodium
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake cmake gcc libcmocka-dev libtool ninja-build pkg-config
      - name: Build libsodium
        run: bash tools/install-libsodium.sh
      - name: Configure and run C tests
        run: |
          cmake -B .build/tests -G Ninja -DCMAKE_BUILD_TYPE=Debug -DRKVC_BUILD_SHARED=ON -DRKVC_BUILD_STATIC=ON -DRKVC_BUILD_TESTS=ON
          cmake --build .build/tests --target check
      - name: Run Python tests
        run: python3 -m unittest discover -s tests/python -p 'test_*.py' -v
      - name: Run Bash tests
        run: |
          for test_script in tests/bash/test_*.sh; do
            bash "$test_script"
          done
      - name: Check exported ABI
        run: bash tools/check-exported-symbols.sh .build/tests/librkvc.so

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Initialize release dependencies
        run: git submodule update --init --depth 1 third_party/libsodium third_party/mpp
      - name: Install cross-build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake binutils cmake curl gcc g++-aarch64-linux-gnu git libtool make ninja-build patchelf pkg-config python3 qemu-user gcc-aarch64-linux-gnu
      - name: Build, verify and smoke-test portable package
        run: python3 tools/rkvc-build package --jobs 6
      - uses: actions/upload-artifact@v7
        with:
          name: aarch64-portable
          path: .build/portable/dist/*.tar.gz

  attach-release:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: aarch64-portable
          path: dist
      - name: Attach verified archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t FILES < <(find dist -type f -name '*.tar.gz' | sort)
          test ${#FILES[@]} -gt 0
          gh release upload "${{ github.event.release.tag_name }}" "${FILES[@]}" --clobber
