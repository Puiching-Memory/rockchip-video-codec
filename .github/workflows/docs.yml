name: Documentation

on:
  push:
    branches: [master, main]
    paths:
      - .github/workflows/docs.yml
      - CMakeLists.txt
      - doxide.yaml
      - README.md
      - zensical.toml
      - docs/**
      - core/include/**
      - codecs/**/include/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl gpg
          echo 'deb http://download.indii.org/deb noble main' | \
            sudo tee /etc/apt/sources.list.d/indii.org.list
          curl -fsSL https://download.indii.org/deb/Release.key | \
            sudo gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/indii.org.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq doxide
          pip install zensical mkdocs-material
      - name: Build API references (Doxide)
        run: |
          mkdir -p .build/api
          cp -r .doxide/* .build/api/
          cd .build/api
          doxide build
          mkdocs build -d api-site
      - name: Build site
        run: |
          zensical build --clean
          cp -r .build/api/api-site site/api
          touch site/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
          single-commit: true
