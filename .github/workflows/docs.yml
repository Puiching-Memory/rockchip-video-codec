name: Documentation

on:
  push:
    branches: [master, main]
    paths:
      - .github/workflows/docs.yml
      - CMakeLists.txt
      - Doxyfile.in
      - README.md
      - zensical.toml
      - docs/**
      - core/include/**
      - codecs/**/include/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq doxygen
          pip install zensical
      - name: Build API docs
        run: |
          mkdir -p .build/docs
          sed -e 's/@PROJECT_NAME@/rkvc/' -e 's/@PROJECT_VERSION@/0.5.0/' \
            -e "s|@CMAKE_CURRENT_SOURCE_DIR@|$PWD|" \
            -e "s|@CMAKE_CURRENT_BINARY_DIR@|$PWD/.build/docs|" \
            Doxyfile.in > .build/docs/Doxyfile
          doxygen .build/docs/Doxyfile
      - name: Build site
        run: |
          zensical build --clean
          cp -r .build/docs/docs/html site/doxygen
          touch site/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
          single-commit: true
