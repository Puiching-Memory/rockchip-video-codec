name: Documentation

on:
  push:
    branches: [master, main]
    paths:
      - .github/workflows/docs.yml
      - CMakeLists.txt
      - Doxyfile.in
      - README.md
      - zensical.toml
      - docs/**
      - include/rkvc/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Initialize libsodium
        run: git submodule update --init --depth 1 third_party/libsodium
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake cmake doxygen libtool
          pip install zensical
      - name: Build libsodium and API docs
        run: |
          bash tools/install-libsodium.sh
          cmake -B .build/docs -DRKVC_BUILD_DOCS=ON
          cmake --build .build/docs --target docs
      - name: Build site
        run: |
          zensical build --clean
          cp -r .build/docs/docs/html site/doxygen
          touch site/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
          single-commit: true
