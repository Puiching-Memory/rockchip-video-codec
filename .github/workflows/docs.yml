name: Documentation

on:
  push:
    branches:
      - master
      - main
    paths:
      - .github/workflows/docs.yml
      - CMakeLists.txt
      - Doxyfile.in
      - README.md
      - zensical.toml
      - docs/**
      - include/rkvc/**
      - lib/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  docs:
    name: Build and deploy docs
    # librga 预编译库仅提供 aarch64/armhf；与 ci.yml 一致使用 ARM runner
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Init submodules (shallow)
        run: git submodule update --init --depth 1 --recursive

      - name: Install librga (from submodule)
        run: ./scripts/install-librga.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq doxygen
          python -m pip install --upgrade pip
          pip install zensical

      - name: Build Doxygen
        run: |
          cmake -B .build/release -DRKVC_BUILD_DOCS=ON
          cmake --build .build/release --target docs

      - name: Upload API docs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-api-docs
          path: .build/release/docs/html/
          if-no-files-found: ignore

      - name: Build site
        run: |
          zensical build --clean
          cp -r .build/release/docs/html site/doxygen
          touch site/.nojekyll

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
          single-commit: true
