# Doxide 配置：生成 rkvc API 引用（Markdown 站源）。
# 注意：0.9.0 的 files 通配不支持 "**" 递归段，用单层 glob。
# files 相对本文件目录；CI 中本目录被拷贝为 .build/api/，路径仍指向仓库根。
# 用法：cd .doxide && doxide build && mkdocs build -d api-site
title: rkvc API 引用
description: Rockchip 媒体图运行库（C++20 会话式媒体运行库，稳定 C ABI 0.5.0）API 引用
files:
  - "../core/include/rkvc/*.hpp"
  - "../core/include/rkvc/*.h"
defines:
  RKVC_API: ""
