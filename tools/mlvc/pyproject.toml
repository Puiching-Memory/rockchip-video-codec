[project]
name = "rkvc-mlvc-export"
version = "1.0.0"
description = "MLVC ONNX → RKNN export for rkvc"
requires-python = ">=3.8,<3.13"
dependencies = [
    "rknn-toolkit2>=2.3.2",
    "onnx>=1.16.1",
    "numpy>=1.20,<=1.26.4",
    "setuptools>=69,<81",
]

[tool.uv]
package = false

# wheel METADATA 声明 onnxoptimizer==0.3.8。aarch64 无预编译 wheel，源码编不过新 CMake。
# 本机 `from rknn.api import RKNN` 不需要该包。
[[tool.uv.dependency-metadata]]
name = "rknn-toolkit2"
version = "2.3.2"
requires-dist = [
    "protobuf>=3.20.3,<=4.25.4",
    "psutil>=5.9.0",
    "ruamel.yaml>=0.17.21",
    "scipy>=1.9.3",
    "tqdm>=4.64.1",
    "opencv-python>=4.5.5.64",
    "fast-histogram>=0.11",
    "numpy<=1.26.4",
    "onnx>=1.16.1",
    "onnxruntime>=1.16.0",
    "torch>=1.13.1,<=2.4.0",
]
