[project]
site_name = "rkvc"
site_description = "Rockchip 媒体图运行库"
site_url = "https://puiching-memory.github.io/rockchip-video-codec/"
repo_url = "https://github.com/Puiching-Memory/rockchip-video-codec"
repo_name = "rkvc"

nav = [
  { "首页" = "index.md" },
  { "快速开始" = "getting-started.md" },
  { "架构" = "architecture.md" },
  { "API 参考" = "api.md" },
  { "测试" = "testing.md" },
  { "打包与分发" = "packaging.md" },
]

[theme]
name = "material"
language = "zh"
features = ["navigation.tabs"]

[[theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue"
accent = "blue"

[[theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue"
accent = "blue"
